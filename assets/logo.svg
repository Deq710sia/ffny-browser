<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <!-- Metallic Platinum / Chrome Gradients -->
    <linearGradient id="metalOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="20%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="80%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Def Jam Signature Crimson Reds -->
    <linearGradient id="defJamRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="25%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Web/Browser Electric Cyan -->
    <linearGradient id="webCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Carbon Dark Shield Fill -->
    <radialGradient id="carbonShield" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- ========================================== -->
    <!-- 1. OUTER HEAVYWEIGHT SHIELD EMBLEM         -->
    <!-- ========================================== -->
    <!-- Outer Beveled Shield Rim -->
    <path d="M 300,24 
             L 420,24 Q 450,24 470,44 L 540,114 Q 560,134 554,162 L 504,380 Q 494,420 464,450 L 300,614 L 136,450 Q 106,420 96,380 L 46,162 Q 40,134 60,114 L 130,44 Q 150,24 180,24 Z"
          fill="url(#metalOuter)" stroke="#475569" stroke-width="2" stroke-linejoin="round" />

    <!-- Inner Metallic Inset Rim -->
    <path d="M 300,38 
             L 412,38 Q 438,38 456,56 L 524,124 Q 542,142 536,166 L 490,366 Q 482,402 454,428 L 300,582 L 146,428 Q 118,402 110,366 L 64,166 Q 58,142 76,124 L 144,56 Q 162,38 188,38 Z"
          fill="url(#carbonShield)" stroke="#090d16" stroke-width="4" stroke-linejoin="round" />

    <!-- Outer Rim Screws / Rivets (Heavy Metal Aesthetic) -->
    <circle cx="178" cy="31" r="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
    <circle cx="422" cy="31" r="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
    <circle cx="548" cy="144" r="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
    <circle cx="52" cy="144" r="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
    <circle cx="488" cy="392" r="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
    <circle cx="112" cy="392" r="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />

    <!-- ========================================== -->
    <!-- 2. THE TOP BROWSER TAB CROWN               -->
    <!-- ========================================== -->
    <!-- Stylized Browser Tab Shape Bolted to Shield Top -->
    <path d="M 220,12 L 380,12 L 396,38 L 204,38 Z" fill="#0f172a" stroke="url(#webCyan)" stroke-width="2" stroke-linejoin="round" />
    <!-- Embedded Code Glyph < / > -->
    <text x="300" y="29" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="3" filter="url(#cyanGlow)">
      &lt; WEB / WASM &gt;
    </text>

    <!-- ========================================== -->
    <!-- 3. CENTER: VINYL RECORD + WEB GLOBE FUSION -->
    <!-- ========================================== -->
    <g transform="translate(300, 260)">
      <!-- Outer Vinyl Edge -->
      <circle cx="0" cy="0" r="148" fill="#030712" stroke="#1f2937" stroke-width="3" />
      
      <!-- Vinyl Grooves -->
      <circle cx="0" cy="0" r="136" fill="none" stroke="#111827" stroke-width="1.5" opacity="0.8" />
      <circle cx="0" cy="0" r="124" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.6" />
      <circle cx="0" cy="0" r="112" fill="none" stroke="#111827" stroke-width="1.5" opacity="0.8" />
      <circle cx="0" cy="0" r="100" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.6" />
      <circle cx="0" cy="0" r="88" fill="none" stroke="#111827" stroke-width="1.5" opacity="0.8" />

      <!-- Web Browser Globe Latitude / Longitude Arcs (Fusing Vinyl with Web) -->
      <g stroke="url(#webCyan)" stroke-width="1.2" opacity="0.45" fill="none">
        <ellipse cx="0" cy="0" rx="142" ry="50" />
        <ellipse cx="0" cy="0" rx="142" ry="95" />
        <line x1="0" y1="-146" x2="0" y2="146" stroke-dasharray="4,4" />
        <line x1="-146" y1="0" x2="146" y2="0" />
      </g>

      <!-- Center Vinyl Hub Plate (Red Record Center) -->
      <circle cx="0" cy="0" r="54" fill="url(#defJamRed)" stroke="#f87171" stroke-width="2" />
      <circle cx="0" cy="0" r="48" fill="none" stroke="#7f1d1d" stroke-width="1.5" />
      <!-- Center Spindle Hole -->
      <circle cx="0" cy="0" r="8" fill="#030712" stroke="#e2e8f0" stroke-width="2" />
      
      <!-- Turntable Tonearm Needle Vector Silhouette -->
      <path d="M 100,-125 L 75,-40 L 45,-15 L 35,-22 L 40,-32 L 68,-50 L 92,-130 Z" 
            fill="url(#metalBevel)" stroke="#0f172a" stroke-width="1.5" filter="url(#textGlow)" opacity="0.95" />
      <circle cx="96" cy="-128" r="8" fill="#94a3b8" stroke="#334155" stroke-width="2" />
    </g>

    <!-- ========================================== -->
    <!-- 4. ICONIC ROMAN NUMERAL "II" (CHROME)      -->
    <!-- ========================================== -->
    <g transform="translate(300, 260)" filter="url(#textGlow)">
      <!-- Left Column (I) -->
      <path d="M -48,-62 L -14,-62 L -14,-48 C -22,-47 -26,-40 -26,-28 L -26,28 C -26,40 -22,47 -14,48 L -14,62 L -48,62 L -48,48 C -40,47 -36,40 -36,28 L -36,-28 C -36,-40 -40,-47 -48,-48 Z"
            fill="url(#metalBevel)" stroke="#090d16" stroke-width="2.5" />
      
      <!-- Right Column (I) -->
      <path d="M 14,-62 L 48,-62 L 48,-48 C 40,-47 36,-40 36,-28 L 36,28 C 36,40 40,47 48,48 L 48,62 L 14,62 L 14,48 C 22,47 26,40 26,28 L 26,-28 C 26,-40 22,-47 14,-48 Z"
            fill="url(#metalBevel)" stroke="#090d16" stroke-width="2.5" />

      <!-- Inner Pillar Inlay Highlights -->
      <line x1="-31" y1="-24" x2="-31" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="31" y1="-24" x2="31" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- ========================================== -->
    <!-- 5. TOP "DEF JAM" CRIMSON BOX HEADER        -->
    <!-- ========================================== -->
    <g transform="translate(300, 78)">
      <!-- Def Jam Signature Red Plate -->
      <rect x="-110" y="0" width="220" height="36" rx="4" fill="url(#defJamRed)" stroke="#fca5a5" stroke-width="1.5" filter="url(#textGlow)" />
      <!-- DEF JAM Text in Bold Stencil Gothic -->
      <text x="0" y="25" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3.5">
        DEF JAM
      </text>
    </g>

    <!-- ========================================== -->
    <!-- 6. "FIGHT FOR NY" CHISELED CHROME TITLE    -->
    <!-- ========================================== -->
    <g transform="translate(300, 150)">
      <!-- "FIGHT" -->
      <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="3" dy="2">
        FIGHT
      </text>
      <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#metalBevel)" stroke="#090d16" stroke-width="2" text-anchor="middle" letter-spacing="3">
        FIGHT
      </text>

      <!-- "FOR NY" Staggered Block -->
      <g transform="translate(0, 36)">
        <rect x="-68" y="-18" width="136" height="26" fill="#030712" stroke="#334155" stroke-width="1.5" />
        <text x="0" y="2" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="3">
          FOR NY
        </text>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 7. LOWER CHAMPIONSHIP "IN BROWSER" RIBBON   -->
    <!-- ========================================== -->
    <g transform="translate(300, 480)" filter="url(#badgeShadow)">
      <!-- Left Ribbon Fold -->
      <path d="M -210,18 L -180,-12 L -180,28 L -210,38 Z" fill="#581c87" />
      <path d="M -210,18 L -180,-12 L -180,28 L -210,38 Z" fill="#7f1d1d" stroke="#450a0a" stroke-width="1" />
      <!-- Right Ribbon Fold -->
      <path d="M 210,18 L 180,-12 L 180,28 L 210,38 Z" fill="#7f1d1d" stroke="#450a0a" stroke-width="1" />

      <!-- Center Main Ribbon Banner -->
      <path d="M -190,-16 L 190,-16 L 175,34 L -175,34 Z" fill="url(#ribbonRed)" stroke="#fca5a5" stroke-width="2" stroke-linejoin="round" />

      <!-- Ribbon Side Notch Tails -->
      <path d="M -190,-16 L -175,34 L -184,8 Z" fill="#450a0a" />
      <path d="M 190,-16 L 175,34 L 184,8 Z" fill="#450a0a" />

      <!-- Left Web Bracket Glyph -->
      <text x="-140" y="19" font-family="monospace" font-size="22" font-weight="900" fill="#38bdf8" filter="url(#cyanGlow)">&lt;</text>

      <!-- "IN BROWSER" Text -->
      <text x="0" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-size="27" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#textGlow)">
        IN BROWSER
      </text>

      <!-- Right Web Bracket Glyph -->
      <text x="128" y="19" font-family="monospace" font-size="22" font-weight="900" fill="#38bdf8" filter="url(#cyanGlow)">&gt;</text>
    </g>

    <!-- Bottom Shield Anchor Point Star -->
    <g transform="translate(300, 545)" fill="#38bdf8" filter="url(#cyanGlow)">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" />
    </g>

  </g>
</svg>